[project]
name = "tg-saver"
version = "0.1.0"
description = "Script to automatisation your Telegram media download"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.14",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "telethon>=1.43.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tg-saver/"]

[project.scripts]
start = "tg_saver.main:start"

[project.urls]
Homepage = "https://github.com/austnv/tg-saver"
Repository = "https://github.com/austnv/tg-saver.git"
Issues = "https://github.com/austnv/tg-saver/issues"